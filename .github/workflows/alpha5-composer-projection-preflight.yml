name: Alpha.5 Composer Projection Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-projection:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout candidate history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none

      - name: Check Alpha.5 Composer projection
        run: ./scripts/check-alpha5-package-projection "$RUNNER_TEMP/alpha5-composer-projection"
