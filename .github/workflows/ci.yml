name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fixed-candidate commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  static-contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Install ripgrep 15.1.0
        run: |
          package="$RUNNER_TEMP/ripgrep_15.1.0-1_amd64.deb"
          curl --fail --silent --show-error --location \
            --output "$package" \
            https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep_15.1.0-1_amd64.deb
          echo "62ce186675c71edbc7c48a67dc36f986974551354d6ce63726adc2d85aad802c  $package" \
            | sha256sum --check
          sudo dpkg --install "$package"
          rg --version | grep -E '^ripgrep 15\.1\.0( \(rev [0-9a-f]+\))?$'
      - name: Run static contracts
        run: ./scripts/check --static
      - name: Check pull-request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

  qualification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      MYSQL_PORT: '3306'
      DB_PORT: '3306'
      CACHE_PORT: '6379'
      PEANUT_STARTER_BACKEND_PORT: '20280'
      PEANUT_STARTER_FRONTEND_PORT: '20281'
      PEANUT_PERFORMANCE_PHP_IMAGE: peanut-admin-performance-php:8.3.24
    steps:
      - name: Validate fixed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout fixed candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Warm web dependency cache
        run: ./scripts/warm-worktree-dependencies
      - name: Bootstrap web dependencies offline
        run: ./scripts/bootstrap-worktree-dependencies
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Build fixed PHP 8.3.24 performance image
        run: docker build --tag peanut-admin-performance-php:8.3.24 --file docker/php/Dockerfile .
      - name: Install ripgrep 15.1.0
        run: |
          package="$RUNNER_TEMP/ripgrep_15.1.0-1_amd64.deb"
          curl --fail --silent --show-error --location \
            --output "$package" \
            https://github.com/BurntSushi/ripgrep/releases/download/15.1.0/ripgrep_15.1.0-1_amd64.deb
          echo "62ce186675c71edbc7c48a67dc36f986974551354d6ce63726adc2d85aad802c  $package" \
            | sha256sum --check
          sudo dpkg --install "$package"
          rg --version | grep -E '^ripgrep 15\.1\.0( \(rev [0-9a-f]+\))?$'
      - name: Install Gitleaks 8.30.1
        run: |
          archive='gitleaks_8.30.1_linux_x64.tar.gz'
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          curl --fail --silent --show-error --location \
            --output gitleaks-checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep " $archive\$" gitleaks-checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Run repository gates
        run: ./scripts/check
