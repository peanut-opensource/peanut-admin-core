name: Alpha.2 Projection Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projections:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout preflight definition and candidate history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.13.0

      - name: Check Alpha.2 projections
        run: ./scripts/check-alpha2-package-projections "$RUNNER_TEMP/alpha2-projections"
