name: Performance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact fixed-candidate commit for the failed-group rerun
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate fixed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Checkout fixed candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify fixed candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Build fixed PHP 8.3.24 performance image
        run: docker build --tag peanut-admin-performance-php:8.3.24 --file docker/php/Dockerfile .
      - name: Run versioned p95 gate
        env:
          PEANUT_PERFORMANCE_PHP_IMAGE: peanut-admin-performance-php:8.3.24
        run: ./scripts/test-performance
