components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Page: { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { in: query, name: page_size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    AuditEventId: { in: path, name: event_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    AuditEventType: { in: query, name: event_type, schema: { type: string, minLength: 1, maxLength: 160 } }
    AuditAction: { in: query, name: action, schema: { type: string, minLength: 1, maxLength: 160 } }
    AuditOutcome: { in: query, name: outcome, schema: { type: string, enum: [success, denied, error] } }
    AuditRequestId: { in: query, name: request_id, schema: { type: string, minLength: 1, maxLength: 160 } }
    AuditTargetType: { in: query, name: target_type, schema: { type: string, minLength: 1, maxLength: 160 } }
    AuditTargetId: { in: query, name: target_id, schema: { type: string, minLength: 1, maxLength: 160 } }
    IfMatch: { in: header, name: If-Match, required: true, schema: { type: string, pattern: '^"rev-[1-9][0-9]*"$' } }
    IfMatchAllowZero: { in: header, name: If-Match, required: true, schema: { type: string, pattern: '^"rev-(0|[1-9][0-9]*)"$' } }
    IfMatchOptional: { in: header, name: If-Match, required: false, schema: { type: string, pattern: '^"rev-[1-9][0-9]*"$' } }
    IfNoneMatchAny: { in: header, name: If-None-Match, required: false, schema: { type: string, const: '*' } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    TenantId: { in: path, name: tenant_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    MemberId: { in: path, name: member_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    EffectiveAccessMemberId:
      in: path
      name: member_id
      required: true
      description: Canonical positive decimal member ID no greater than the server PHP_INT_MAX value.
      schema: { type: string, pattern: '^[1-9][0-9]*$', maxLength: 19 }
    DepartmentId: { in: path, name: department_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    RoleId: { in: path, name: role_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    OperatorId: { in: path, name: operator_id, required: true, schema: { $ref: './schemas/common.yaml#/$defs/BigIntString' } }
    ModuleKey: { in: path, name: module_key, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9.-]+$' } }
    ReferenceCodeOwnerModuleKey: { in: path, name: module_key, required: true, schema: { $ref: './schemas/reference-codes.yaml#/ModuleKey' } }
    ReferenceCodeSetKey: { in: path, name: set_key, required: true, schema: { $ref: './schemas/reference-codes.yaml#/LocalKey' } }
    ReferenceCodeKey: { in: path, name: code, required: true, schema: { $ref: './schemas/reference-codes.yaml#/LocalKey' } }
    ReferenceCodeIfNoneMatch: { in: header, name: If-None-Match, required: true, schema: { type: string, const: '*' } }
    ReferenceCodeIfMatch: { in: header, name: If-Match, required: true, schema: { $ref: './schemas/reference-codes.yaml#/StrongReferenceCodeEtag' } }
    SettingModuleKey:
      in: path
      name: module_key
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 96
        pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*(?:\.[a-z][a-z0-9]*(?:-[a-z0-9]+)*)*$'
    SettingKey:
      in: path
      name: setting_key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
  requestBodies:
    ModuleConfigWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [config]
            properties:
              config: { type: object, additionalProperties: true }
    DataPolicyWrite:
      required: true
      content:
        application/json:
          schema: { $ref: './schemas/authorization.yaml#/ReplaceDataPolicyRequest' }
  responses:
    Problem:
      description: RFC 9457 problem response
      headers:
        X-Request-Id: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/problem+json:
          schema: { $ref: './schemas/common.yaml#/$defs/Problem' }
    RateLimitedProblem:
      description: RFC 9457 rate limit problem response
      headers:
        X-Request-Id: { schema: { type: string } }
        Cache-Control: { schema: { type: string, const: no-store } }
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: './schemas/common.yaml#/$defs/Problem' }
