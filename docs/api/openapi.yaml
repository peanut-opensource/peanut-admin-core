paths:
  /api/v1/import-export/operations:
    get:
      operationId: listImportExportOperations
      summary: listImportExportOperations
      x-handler: 'PeanutAdmin\App\controller\api\v1\ImportExportController::index'
      x-module-key: peanut.import-export
      x-permission: peanut.import-export.read
      parameters: [{ in: query, name: status, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: *importExportListResponse
  /api/v1/import-export/operations/{operation_key}:
    parameters: [{ in: path, name: operation_key, required: true, schema: { $ref: './schemas/import-export.yaml#/OperationKey' } }]
    get: { operationId: getImportExportOperation, summary: getImportExportOperation, x-handler: 'PeanutAdmin\App\controller\api\v1\ImportExportController::show', x-module-key: peanut.import-export, x-permission: peanut.import-export.read, responses: *importExportResponse }
  /api/v1/import-export/imports:
    post:
      operationId: submitImport
      summary: submitImport
      x-handler: 'PeanutAdmin\App\controller\api\v1\ImportExportController::submitImport'
      x-module-key: peanut.import-export
      x-permission: peanut.import-export.create
      x-host-atomic-idempotency: true
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: './schemas/import-export.yaml#/SubmitImportRequest' } } } }
      responses: *importExportCreatedResponse
  /api/v1/import-export/exports:
    post:
      operationId: submitExport
      summary: submitExport
      x-handler: 'PeanutAdmin\App\controller\api\v1\ImportExportController::submitExport'
      x-module-key: peanut.import-export
      x-permission: peanut.import-export.create
