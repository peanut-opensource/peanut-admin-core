Member:
  type: object
  additionalProperties: false
  required: [id, status, security_revision, revision, role_keys]
  properties:
    id: { type: string, pattern: '^[1-9][0-9]*$' }
    account_id: { type: string, pattern: '^[1-9][0-9]*$' }
    display_name: { type: [string, 'null'], maxLength: 120 }
    member_no: { type: [string, 'null'], maxLength: 64 }
    member_type: { type: string, enum: [internal, external] }
    primary_department_id: { type: [string, 'null'], pattern: '^[1-9][0-9]*$' }
    status: { type: string, enum: [pending, active, suspended, left] }
    security_revision: { type: string, pattern: '^[1-9][0-9]*$' }
    revision: { type: string, pattern: '^[1-9][0-9]*$' }
    role_keys:
      type: array
      items: { type: string }

CreateMemberRequest:
  type: object
  additionalProperties: false
  required: [email, display_name]
  properties:
    email: { type: string, format: email }
    display_name: { type: string, minLength: 1, maxLength: 120 }
    initial_password:
      type: string
      writeOnly: true
      description: Required only when the exact email does not already identify an account.

UpdateMemberRequest:
  type: object
  additionalProperties: false
  properties:
    display_name: { type: [string, 'null'], maxLength: 120 }
    primary_department_id: { type: [string, 'null'], pattern: '^[1-9][0-9]*$' }

ReplaceMemberRolesRequest:
  type: object
  additionalProperties: false
  required: [role_ids]
  properties:
    role_ids:
      type: array
      uniqueItems: true
      items: { type: string, pattern: '^[1-9][0-9]*$' }

MemberResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data: { $ref: '#/Member' }
    meta: { $ref: './common.yaml#/$defs/RequestMeta' }

MemberListResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: array
      items: { $ref: '#/Member' }
    meta: { $ref: './common.yaml#/$defs/PageMeta' }
