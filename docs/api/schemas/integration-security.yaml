ResponseMeta:
  type: object
  additionalProperties: false
  required: [request_id]
  properties:
    request_id: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$' }
MachineIdentity:
  type: object
  additionalProperties: false
  required: [identity_key, name, scopes, status, token_prefix, token_last_four, expires_at, last_used_at, revision, created_at]
  properties:
    identity_key: { type: string, pattern: '^machine_[0-9a-f]{32}$' }
    name: { type: string, minLength: 1, maxLength: 120 }
    scopes: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$' } }
    status: { type: string, enum: [active, rotated, revoked] }
    token_prefix: { type: string, pattern: '^pa_mi_' }
    token_last_four: { type: string, pattern: '^[A-Za-z0-9_-]{4}$' }
    expires_at: { type: [string, 'null'], format: date-time }
    last_used_at: { type: [string, 'null'], format: date-time }
    revision: { type: integer, minimum: 1 }
    created_at: { type: string, format: date-time }
ProvisionedMachineIdentity:
  type: object
  additionalProperties: false
  required: [identity, token]
  properties:
    identity: { $ref: '#/MachineIdentity' }
    token: { type: string, pattern: '^pa_mi_[A-Za-z0-9_-]{43}$' }
WebhookEndpoint:
  type: object
  additionalProperties: false
  required: [endpoint_key, name, url, events, status, revision, created_at]
  properties:
    endpoint_key: { type: string, pattern: '^webhook_[0-9a-f]{32}$' }
    name: { type: string, minLength: 1, maxLength: 120 }
    url: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
    events: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$' } }
    status: { type: string, enum: [active, disabled] }
    revision: { type: integer, minimum: 1 }
    created_at: { type: string, format: date-time }
ProvisionedWebhookEndpoint:
  type: object
  additionalProperties: false
  required: [endpoint, signing_secret]
  properties:
    endpoint: { $ref: '#/WebhookEndpoint' }
    signing_secret: { type: string, pattern: '^whsec_[A-Za-z0-9_-]{43}$' }
WebhookDeliveryRecord:
  type: object
  additionalProperties: false
  required: [delivery_key, endpoint_key, event_type, status, attempt_count, last_status_code, last_error_code, created_at, updated_at, delivered_at]
  properties:
    delivery_key: { type: string, pattern: '^delivery_[0-9a-f]{32}$' }
    endpoint_key: { type: string, pattern: '^webhook_[0-9a-f]{32}$' }
    event_type: { type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$' }
    status: { type: string, enum: [pending, delivering, retryable, delivered, permanent_failed] }
    attempt_count: { type: integer, minimum: 0, maximum: 8 }
    last_status_code: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    last_error_code: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
    created_at: { type: string, format: date-time }
    updated_at: { type: string, format: date-time }
    delivered_at: { type: [string, 'null'], format: date-time }
WebhookAttemptRecord:
  type: object
  additionalProperties: false
  required: [attempt_number, outcome, response_status, error_code, duration_ms, attempted_at]
  properties:
    attempt_number: { type: integer, minimum: 1, maximum: 8 }
    outcome: { type: string, enum: [retryable, delivered, permanent_failed] }
    response_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    error_code: { type: [string, 'null'], pattern: '^[A-Z][A-Z0-9_]{2,63}$' }
    duration_ms: { type: integer, minimum: 0, maximum: 30000 }
    attempted_at: { type: string, format: date-time }
SessionDevice:
  type: object
  additionalProperties: false
  required: [session_key, client_key, status, current, masked_ip, user_agent_fingerprint, issued_at, last_seen_at, absolute_expires_at, revoked_at]
  properties:
    session_key: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{26}$' }
    client_key: { type: string, const: admin-web }
    status: { type: string, enum: [active, revoked, expired] }
    current: { type: boolean }
    masked_ip: { type: [string, 'null'], maxLength: 45 }
    user_agent_fingerprint: { type: [string, 'null'], pattern: '^[0-9a-f]{12}$' }
    issued_at: { type: string, format: date-time }
    last_seen_at: { type: string, format: date-time }
    absolute_expires_at: { type: string, format: date-time }
    revoked_at: { type: [string, 'null'], format: date-time }
ObjectData:
  oneOf:
    - { $ref: '#/MachineIdentity' }
    - { $ref: '#/ProvisionedMachineIdentity' }
    - { $ref: '#/WebhookEndpoint' }
    - { $ref: '#/ProvisionedWebhookEndpoint' }
    - { $ref: '#/SessionDevice' }
ListItem:
  oneOf:
    - { $ref: '#/MachineIdentity' }
    - { $ref: '#/WebhookEndpoint' }
    - { $ref: '#/SessionDevice' }
PageItem:
  oneOf:
    - { $ref: '#/WebhookDeliveryRecord' }
    - { $ref: '#/WebhookAttemptRecord' }
ObjectResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data: { $ref: '#/ObjectData' }
    meta: { $ref: '#/ResponseMeta' }
ListResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/ListItem' } }
    meta: { $ref: '#/ResponseMeta' }
PageResponse:
  type: object
  additionalProperties: false
  required: [data, meta]
  properties:
    data:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items: { type: array, items: { $ref: '#/PageItem' } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    meta: { $ref: '#/ResponseMeta' }
MachineCreateRequest:
  type: object
  additionalProperties: false
  required: [name, scopes, expires_at]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    scopes: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$' } }
    expires_at: { type: [string, 'null'], format: date-time }
WebhookCreateRequest:
  type: object
  additionalProperties: false
  required: [name, url, events]
  properties:
    name: { type: string, minLength: 1, maxLength: 120 }
    url: { type: string, format: uri, pattern: '^https://', maxLength: 2048 }
    events: { type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: { type: string, pattern: '^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)+$' } }
