x-base-headers: &baseHeaders
  X-Request-Id:
    description: Request correlation identifier.
    schema: { type: string }
  Cache-Control:
    description: Sensitive API responses are not cached.
    schema: { type: string, const: no-store }
x-versioned-headers: &versionedHeaders
  <<: *baseHeaders
  ETag:
    description: Current resource revision.
    schema: { type: string, pattern: '^"rev-[1-9][0-9]*"$' }
x-created-headers: &createdHeaders
  <<: *versionedHeaders
  Location:
    description: Canonical resource URL.
    schema: { type: string }
x-authenticated-headers: &authenticatedHeaders
  <<: *baseHeaders
  Set-Cookie:
    description: HttpOnly refresh credential cookie.
    schema: { type: string }

TenantLoginOk:
  description: Authentication completed or tenant selection is required.
  headers: *baseHeaders
  content: { application/json: { schema: { $ref: './schemas/auth.yaml#/TenantLoginResponse' } } }
TenantAuthenticatedOk:
  description: Tenant session authenticated.
  headers: *authenticatedHeaders
  content: { application/json: { schema: { $ref: './schemas/auth.yaml#/TenantAuthenticationResponse' } } }
TenantSelectionOk:
